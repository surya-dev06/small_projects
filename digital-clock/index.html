<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Clock</title><link rel="stylesheet" href="style.css"></head><body><div class="card"><h1>Digital Clock</h1><div class="big" id="c"></div><div style="text-align:center" id="dt"></div></div><script>
function tick(){const n=new Date();c.textContent=n.toLocaleTimeString();dt.textContent=n.toDateString()}tick();setInterval(tick,1000);
</script></body></html>
